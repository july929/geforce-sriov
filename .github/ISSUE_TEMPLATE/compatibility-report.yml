name: Compatibility report
description: Tell us whether geforce-sriov works on your hardware, whether it worked or not.
title: "[Compatibility] "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing geforce-sriov. Reports are voluntary. **A setup that does not work is as
        useful as one that works**: choose *Does not work* or *Partially* under Result and tell us
        where it stopped. Software bugs that do not depend on your hardware go in a bug report.

        The most useful report comes after the power cycle and a first VM that ran with a vGPU.
        A report taken right after the install says "not yet activated" on the `State:` line near its top.
        Keep that one for later.

        Run this on the host and paste the output once:

        ```
        sudo geforce-sriov report
        ```

        The command collects your GPU, host, driver, settings, `status` output and kernel log lines.
        It removes IP and MAC addresses, serial numbers, GPU UUIDs, host and user names and licence
        details before it prints. See
        [docs/compatibility.md](https://github.com/noon-at-cgn/geforce-sriov/blob/main/docs/compatibility.md)
        for what it collects. Run it from the build folder as `sudo ./geforce-sriov report` if you
        have not installed geforce-sriov.
  - type: dropdown
    id: result
    attributes:
      label: Result
      description: A setup that does not work is as useful a report as one that works.
      options:
        - Works
        - Works with caveats
        - Partially
        - Does not work
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Output of geforce-sriov report
      description: Paste everything the command printed, from the first `~~~text` line to the last `~~~` line.
      render: text
    validations:
      required: true
  - type: input
    id: guests
    attributes:
      label: Guests you tried
      description: The guest OS, its vGPU type and the NVIDIA guest driver version. The host cannot see these.
      placeholder: "Windows 11 with RTXA6000-4Q and driver <version>; Debian 12 with RTXA6000-4Q and driver <version>"
  - type: textarea
    id: notes
    attributes:
      label: What went wrong, and other notes
      description: If something did not work, name the step, the message you got and what you tried. Mention a memory-modded or otherwise modified board here.
  - type: checkboxes
    id: privacy
    attributes:
      label: Private details
      options:
        - label: I read the report above. It has no private details such as secrets or licence files, and I removed any that I added myself.
          required: true
